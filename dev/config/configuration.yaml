# Development instance: demo entities for every supported type.
# Explicit list instead of default_config (Bluetooth crashes on macOS).
config:
frontend:
history:
logbook:
recorder:
sun:
person:
search:
system_health:
input_boolean:
input_number:
input_select:
automation:
script:
scene: !include scenes.yaml

homeassistant:
  name: Weekly Planner dev
  latitude: 50.85
  longitude: 4.35
  elevation: 50
  unit_system: metric
  time_zone: Europe/Brussels
  country: BE
  language: fr
  packages: !include_dir_named packages

http:
  server_port: 8124

logger:
  default: warning
  logs:
    custom_components.weekly_planner: debug

# Built-in demo platforms: climate, cover, light, fan, water_heater, media_player, switch…
demo:
