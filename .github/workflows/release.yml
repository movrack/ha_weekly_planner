name: Release

# Creates the git tag and the GitHub release of the version found in the checked-out commit, with
# `weekly_planner.zip` attached: the file HACS installs (`zip_release` in hacs.json). The card bundle is
# not in the repository; it is built here.
# - Final version (`0.30.0`): after a merge into `main` (or a manual run on `main`); marked latest.
# - Pre-release (`0.30.0-beta.1`, a version with "-"): manual run ("Run workflow") from any branch;
#   marked pre-release, never latest. A push on `main` never publishes one.
# It does nothing when the release already exists, so re-runs are harmless.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read and check the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          v=$(python3 -c 'import json;print(json.load(open("custom_components/weekly_planner/manifest.json"))["version"])')
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          node=$(python3 -c 'import json;print(json.load(open("frontend/package.json"))["version"])')
          if [ "$v" != "$py" ] || [ "$v" != "$node" ]; then
            echo "Versions differ: manifest=$v pyproject=$py package.json=$node" >&2
            exit 1
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Version $v is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-suffix (0.30.0-beta.1)" >&2
            exit 1
          fi
          case "$v" in
            *-*)
              if [ "$EVENT" != "workflow_dispatch" ]; then
                echo "Pre-release $v is published only by a manual run, never by a push on main" >&2
                exit 1
              fi
              echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)
              if [ "$REF" != "refs/heads/main" ]; then
                echo "Final version $v is published only from main (this run: $REF)" >&2
                exit 1
              fi
              echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Skip when the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists: nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Notes from CHANGELOG.md
        if: steps.exists.outputs.exists == 'false'
        env:
          V: ${{ steps.version.outputs.version }}
        run: scripts/release_notes.sh "$V" > notes.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.exists.outputs.exists == 'false'
        with:
          node-version: 22
      - name: Build the card
        if: steps.exists.outputs.exists == 'false'
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Pack and check weekly_planner.zip
        if: steps.exists.outputs.exists == 'false'
        # fails, before any release exists, when manifest.json or the card bundle is missing or misplaced
        env:
          V: ${{ steps.version.outputs.version }}
        run: python3 scripts/release_zip.py "$V" weekly_planner.zip
      - name: Create the release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            kind=(--prerelease --latest=false)
          else
            kind=(--latest)
          fi
          gh release create "v$V" weekly_planner.zip \
            --target "$GITHUB_SHA" \
            --title "v$V" \
            --notes-file notes.md "${kind[@]}"
