# Weekly Planner: annotated example of /config/www/weekly_planner.yml (copy, adapt, save the real file).
# A valid change is imported within 30 seconds (or call the weekly_planner.reload action).
# An invalid file changes nothing: a repair issue shows the error.
version: 1
vacation: false            # legacy global pause switch; leave false

labels:                    # "settings": a name, a colour and what to do on the device
  - id: comfort
    name: Comfort
    color: "#ff9800"
    action: {kind: service, service: climate.set_temperature, data: {temperature: 21}}
  - id: eco
    name: Eco
    color: "#4caf50"
    action: {kind: service, service: climate.set_temperature, data: {temperature: 17}}

programs:
  - id: living-room       # stable id, keep it when renaming
    name: Living room
    enabled: true
    priority: 10          # 1-100; the highest priority wins when two programs target a device
    entities:             # 1-100 devices; any entity that has a service the label calls
      - entity_id: climate.living_room   # use a real entity of your Home Assistant
        default_label: eco                # applied "the rest of the time"
        label_overrides: {}               # per-device action for a label, same shape as `action`
    active_profile: normal
    profiles:             # modes ("weeks"); one is enough
      - id: normal
        name: Normal
        days:             # exactly 7 lists, Monday first; [] = nothing that day
          - &workday
            - {id: morning, start: {time: "06:30"}, end: {time: "08:30"}, label: comfort}
            - {id: evening, start: {time: "18:00"}, end: {time: "22:30"}, label: comfort}
          - *workday
          - *workday
          - *workday
          - *workday
          - - {id: weekend-day, start: {time: "08:00"}, end: {time: "23:00"}, label: comfort}   # Saturday
          - - {id: sun-day, start: {time: "08:00"}, end: {time: "23:00"}, label: comfort}       # Sunday
        # Solar times: start: {sun: sunset, offset: -30, earliest: "17:00", latest: "21:00"}
