# Self-declared Home Assistant Integration Quality Scale (target: Bronze).
# Custom integration: hassfest does not read this file, tests/test_quality_scale.py keeps it consistent.
# Do not add "quality_scale" to manifest.json (reserved for Home Assistant core).
# Plan and reasons: docs/PLAN_QUALITY_SCALE.md, docs/DECISIONS.md (2026-11-08).
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: No polling (should_poll is False, iot_class is calculated); the engine pushes changes.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirement (requirements is empty).
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no device trigger.
  docs-conditions:
    status: exempt
    comment: The integration provides no device condition.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: No connection to a device or service; nothing to test in the config flow.
  test-before-setup:
    status: exempt
    comment: No connection to a device or service; setup cannot fail on a missing device.
  unique-config-entry: done

  # Silver (not a goal)
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold (not a goal)
  devices: done
  diagnostics: todo
  discovery: todo
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: done
  stale-devices: todo

  # Platinum (not a goal)
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
