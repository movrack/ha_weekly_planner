[project]
name = "weekly-planner"
version = "0.3.5"
description = "Weekly time-slot planner for Home Assistant"
requires-python = ">=3.14.2,<3.15"
license = "MIT"

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component==0.13.374",
]
lint = [
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--timeout=60"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
